<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Space FTU 🌱</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
</head>
<body>

<!-- ═══ LOGIN SCREEN ═══════════════════════════════════════════════ -->
<div id="login-screen" class="screen active">
  <div class="login-bg">
    <div class="pixel-stars" id="stars"></div>
    <div class="login-box">
      <div class="login-logo">
        <div class="logo-char">🌱</div>
        <h1>Study Space FTU</h1>
        <p class="subtitle">Sân chơi pixel của nhóm tình nguyện</p>
      </div>

      <div class="login-form">
        <label>Tên của bạn</label>
        <input type="text" id="player-name" placeholder="Nhập tên..." maxlength="12" />

        <label>Chọn nhân vật</label>
        <div id="char-grid" class="char-grid"></div>

        <div class="char-preview-row">
          <canvas id="char-preview" width="8" height="12"
            style="width:48px;height:72px;image-rendering:pixelated;"></canvas>
          <div class="char-preview-hint">← click để chọn nhân vật</div>
        </div>

        <button id="join-btn" class="pixel-btn primary">▶ Vào World</button>
      </div>
    </div>

    <div class="deco-chars">
      <canvas class="deco-char" id="deco1" width="32" height="48"></canvas>
      <canvas class="deco-char" id="deco2" width="32" height="48"></canvas>
      <canvas class="deco-char" id="deco3" width="32" height="48"></canvas>
    </div>
  </div>
</div>

<!-- ═══ GAME SCREEN ════════════════════════════════════════════════ -->
<div id="game-screen" class="screen">

  <!-- HUD Bar -->
  <div class="hud">
    <div class="hud-left">
      <canvas id="hud-avatar" width="8" height="12"
        style="width:24px;height:36px;image-rendering:pixelated;"></canvas>
      <span id="hud-name">Player</span>
    </div>
    <div class="hud-center">
      <span class="world-title">🎓 Study Space FTU</span>
    </div>
    <div class="hud-right">
      <span id="online-count">👥 <span id="n-online">1</span> online</span>
      <button class="pixel-btn danger small" id="logout-btn">✖ Thoát</button>
    </div>
  </div>

  <!-- World + overlays -->
  <div class="world-container">
    <canvas id="world-canvas"></canvas>

    <!-- Proximity panel – appears when player walks near a hub -->
    <div id="proximity-panel" class="proximity-panel hidden">
      <div class="prox-title" id="prox-title">Hub</div>
      <div class="prox-desc"  id="prox-desc"></div>
      <div class="prox-status" id="prox-status"></div>
      <button class="pixel-btn green small" id="proximity-join-btn">📹 Vào Meet</button>
    </div>

    <!-- Online players -->
    <div class="online-panel">
      <div class="panel-header">👥 Đang online</div>
      <div id="online-list"></div>
    </div>

    <!-- Controls hint -->
    <div class="controls-hint">
      <span>WASD / ↑↓←→ di chuyển</span>
      <span class="hint-sep">·</span>
      <span>SPACE hoặc E vào hub</span>
      <span class="hint-sep">·</span>
      <span>Click hub bất kỳ</span>
    </div>
  </div>

  <!-- Mobile D-pad -->
  <div class="mobile-controls">
    <button class="dpad-btn" id="btn-up">▲</button>
    <div class="dpad-row">
      <button class="dpad-btn" id="btn-left">◀</button>
      <button class="dpad-btn center-btn" id="btn-interact">✦</button>
      <button class="dpad-btn" id="btn-right">▶</button>
    </div>
    <button class="dpad-btn" id="btn-down">▼</button>
  </div>

  <!-- Meet Modal -->
  <div id="meet-modal" class="modal-overlay hidden">
    <div class="modal-box" id="modal-box">
      <div class="modal-header">
        <canvas id="modal-char" width="8" height="12"
          style="width:40px;height:60px;image-rendering:pixelated;flex-shrink:0;"></canvas>
        <div>
          <h2 id="modal-hub-name">Hub Name</h2>
          <p id="modal-hub-desc">Mô tả hub</p>
        </div>
      </div>
      <div class="modal-status-bar" id="modal-status-bar">
        <span id="modal-active-users"></span>
      </div>
      <div class="modal-actions">
        <button class="pixel-btn primary large" id="create-meet-btn">📹 Tạo &amp; Tham gia Meet</button>
        <button class="pixel-btn secondary" id="copy-link-btn">🔗 Copy Link</button>
      </div>
      <div class="meet-link-box hidden" id="meet-link-box">
        <p>Google Meet link của bạn:</p>
        <a id="meet-link-a" href="#" target="_blank" class="meet-link-text"></a>
        <div class="pixel-note">Link tự mở sau 3s...</div>
      </div>
      <button class="pixel-btn danger small modal-close" id="modal-close-btn">✖ Đóng</button>
    </div>
  </div>

  <!-- Chat input -->
  <div class="chat-input-bar">
    <input type="text" id="chat-input" placeholder="Nhắn gì đó... (Enter)" maxlength="60" />
    <button class="pixel-btn small" id="chat-send">💬</button>
  </div>

</div><!-- end #game-screen -->

<script src="game.js"></script>
</body>
</html>
